---
name: Build disk images

# ⚠️ This workflow has NEVER completed — here or upstream
# (ublue-os/image-template registers it and has never once run it), so it is
# unexercised template code, not a path anything has relied on.
#
# PR #40 fixed five defects that killed it before it reached a build (a missing
# disk_config/iso.toml, an unmatched paths: filter, inputs.platform being null on
# pull_request, an action pin too old for ubuntu-26.04, and a missing
# --rootfs=btrfs). Two blockers remain, both from the base image: qcow2 rejects
# `customizations.filesystem`, and the anaconda-iso depsolve cannot find Bazzite's
# terra-mesa GPG key. See README §Build for detail. Do not treat a green
# "Build container image" badge as evidence this workflow works.
on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    # NOTE: no leading './' — GitHub matches these against the repo-root-relative
    # path, so './…' never matches and the workflow silently never ran on a PR.
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso-kde.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # `inputs` is null on pull_request, so the bare comparison selected the arm64
    # runner for a PR that builds amd64 media. Default to amd64 off-dispatch.
    runs-on: ${{ (inputs.platform || 'amd64') == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: (inputs.platform || 'amd64') == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: (inputs.platform || 'amd64') != 'arm64'
        # Pin matches build.yml. The previous pin (…cc0becac, "v9") runs
        # `apt-get remove … powershell`, which is not an apt package on the
        # ubuntu-26.04 runner: apt exits 100 under `set -e` and the step dies
        # with "E: Unable to locate package powershell" before bootc-image-builder
        # ever runs. This is what actually killed the workflow's first-ever run.
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@cb4b3e9c112077ea96a191fad229d51d2a012885 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          # The upstream template references ./disk_config/iso.toml, which upstream
          # does not ship either. This repo carries iso-kde.toml (the image is
          # bazzite-nvidia-open = KDE, and it bakes /etc/plasmalogin.conf.d/).
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso-kde.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # --rootfs=btrfs mirrors the repo's own `just _build-bib`, which already
          # passes it. bootc-image-builder stopped inferring the filesystem: on
          # `:latest` it now aborts with "no default root filesystem type specified
          # in container, please use --rootfs" (osbuild/bootc-image-builder#494).
          # The local build path knew this; the workflow never did.
          additional-args: --use-librepo=True --rootfs=btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
