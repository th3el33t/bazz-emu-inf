[global]
   workgroup = WORKGROUP
   server string = water-demon
   log file = /var/log/samba/log.%m
   map to guest = never

# Drop audio into in/, transcripts appear in out/, originals move to done/.
# The samba password for shrinksenpai is NOT in the image — the owner runs
# `sudo smbpasswd -a shrinksenpai` once (two-layer rule).
[audio]
   path = /srv/audio
   read only = no
   valid users = shrinksenpai
   create mask = 0664
   directory mask = 0775
