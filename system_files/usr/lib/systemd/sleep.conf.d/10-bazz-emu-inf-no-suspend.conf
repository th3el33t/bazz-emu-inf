# WaterDemon is a headless game-streaming + LLM-inference + Minecraft host. It
# must NEVER auto-suspend: on idle, KDE Powerdevil asks logind to suspend, the
# box drops to S3, and it falls off the network entirely (looks exactly like a
# hard hang; only a power-cycle recovers it). This bit us twice on 2026-08-31 —
# both "crashes" were `PM: suspend entry (deep)`. Refuse all sleep at the
# logind/systemd layer, which every DE ultimately routes through.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
