# Sunveil tuning for bazz-emu-inf (WaterDemon). Sourced by the stream hooks.
VM_NAME="sunshine-vm"
# true  = headless: physical monitors off while streaming, restored on disconnect
# false = coexist: virtual display is an extra screen; real monitors stay on
DISABLE_PHYSICAL=true
# used only if the Moonlight client doesn't report a resolution
FALLBACK_WIDTH=1920
FALLBACK_HEIGHT=1080
FALLBACK_FPS=60
# krfb runs a VNC server for the virtual monitor; Sunshine captures via KWin, not VNC.
VNC_PASSWORD="sunshine"
VNC_PORT=5905
# Extra kscreen-doctor args applied to the virtual output; token "VM" -> its name.
# e.g. EXTRA_VM_KSCREEN=(output.VM.scale.1)
EXTRA_VM_KSCREEN=()
